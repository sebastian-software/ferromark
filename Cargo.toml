[package]
name = "ferromark"
version = "0.9.0"
edition = "2024"
rust-version = "1.94"
description = "Markdown to HTML with a secure default and every GFM extension included."
license = "MIT OR Apache-2.0"
authors = ["Sebastian Software GmbH"]
repository = "https://github.com/sebastian-software/ferromark"
homepage = "https://sebastian-software.github.io/ferromark/"
documentation = "https://docs.rs/ferromark"
readme = "README.md"
# crates.io allows at most five keywords; "ferramenta" marks the tool family.
keywords = ["markdown", "html", "commonmark", "gfm", "ferramenta"]
categories = ["parsing", "text-processing", "web-programming"]
exclude = [
    "benchmarks/bun-comparison",
    "benchmarks/cmark-comparison",
    "benchmarks/md4c-comparison",
    "benchmarks/pulldown-comparison",
    "fuzz",
    "node",
]

[package.metadata.docs.rs]
features = ["mdx"]
no-default-features = true

[workspace]
members = ["node/native", "crates/ferro-byte-search"]
resolver = "2"

# The workspace lints mirror the CI gate (clippy with `-D warnings` over all
# targets and features), so a local build or clippy run fails on exactly what
# CI rejects.
[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[lints]
workspace = true

[lib]
name = "ferromark"
path = "src/lib.rs"

[[bin]]
name = "ferromark"
path = "src/main.rs"

[dependencies]
memchr = "2.7"
smallvec = "1.13"
html-escape = { version = "0.2", default-features = false }
rustc-hash = { version = "2.0" }
unicode-ident = "1.0"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = []
mdx = []
profiling = []

[[example]]
name = "mdx_segment"
required-features = ["mdx"]

[[example]]
name = "performance_audit"
required-features = ["mdx"]

[[bench]]
name = "parsing"
harness = false

[[bench]]
name = "footnotes"
harness = false

[[bench]]
name = "fenced_code_renderer"
harness = false

[[bench]]
name = "options"
harness = false

[[bench]]
name = "mdx"
harness = false
required-features = ["mdx"]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
strip = true

# N-API catches Rust panics and turns them into JavaScript exceptions. Cargo only
# reads workspace profiles from this manifest, so the Node addon must opt into
# this profile explicitly rather than defining it in node/native/Cargo.toml.
[profile.release-node]
inherits = "release"
panic = "unwind"

[profile.release-debug]
inherits = "release"
debug = true
strip = false

[profile.bench]
inherits = "release"
debug = true
