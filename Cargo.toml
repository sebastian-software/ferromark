[workspace]
resolver = "2"
members = ["crates/ferromark", "crates/ferromark_allocator", "crates/ferromark_ast", "crates/ferromark_parser", "crates/ferromark_renderer", "node/native"]

[workspace.package]
version = "2.0.0-rc.1" # x-release-please-version
authors = ["ubugeeei", "Sebastian Software GmbH"]
categories = ["text-processing", "parser-implementations"]
edition = "2024"
keywords = ["markdown", "commonmark", "gfm", "parser", "html"]
license = "MIT"
rust-version = "1.95.0"
publish = ["crates-io"]
repository = "https://github.com/sebastian-software/ferromark"
homepage = "https://sebastian-software.github.io/ferromark/"

[workspace.lints.rust]
unsafe_code = "warn"
absolute_paths_not_starting_with_crate = "warn"
non_local_definitions = "warn"
redundant_lifetimes = "warn"
unit_bindings = "warn"
unnameable_types = "warn"

[workspace.lints.clippy]
# Lint groups with lower priority
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Restrictions
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
format_push_string = "deny"
format_collect = "deny"
format_in_format_args = "deny"
to_string_in_format_args = "deny"
unused_format_specs = "deny"
useless_format = "deny"
write_with_newline = "deny"
writeln_empty_string = "deny"
disallowed_macros = "allow"
disallowed_methods = "allow"
disallowed_types = "allow"

# Allow
match_same_arms = "allow"
option_if_let_else = "allow"
case_sensitive_file_extension_comparisons = "allow"
single_option_map = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"
doc_markdown = "allow"
similar_names = "allow"
needless_pass_by_value = "allow"
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"
missing_const_for_fn = "allow"
cast_possible_truncation = "allow"
struct_excessive_bools = "allow"
unnecessary_wraps = "allow"
wildcard_imports = "allow"
if_not_else = "allow"
unnested_or_patterns = "allow"
derive_partial_eq_without_eq = "allow"
elidable_lifetime_names = "allow"
range_plus_one = "allow"
use_self = "allow"

[workspace.dependencies]
ferromark = { path = "crates/ferromark", version = "=2.0.0-rc.1" } # x-release-please-version
ferromark_allocator = { path = "crates/ferromark_allocator", version = "=2.0.0-rc.1" } # x-release-please-version
ferromark_ast = { path = "crates/ferromark_ast", version = "=2.0.0-rc.1" } # x-release-please-version
ferromark_parser = { path = "crates/ferromark_parser", version = "=2.0.0-rc.1" } # x-release-please-version
ferromark_renderer = { path = "crates/ferromark_renderer", version = "=2.0.0-rc.1" } # x-release-please-version
bumpalo = "3.16"
compact_str = "0.10.0"
smallvec = "1.15"
memchr = "2.7"
rustc-hash = "2"
thiserror = "2"
serde_json = "1.0"
criterion = "0.8"
insta = "1"

[profile.dev]
debug = 2

[profile.dev.package]
# Snapshot testing spends most of its time in diff/render helpers rather than
# ferromark itself. Optimizing only these dev dependencies keeps normal debug
# builds fast while making `cargo test` output comparison cheaper.
insta.opt-level = 3
similar.opt-level = 3

[profile.release]
# Local binaries and benchmarks use this profile. It intentionally
# favors runtime throughput over compile time: fat LTO plus a single codegen
# unit gives LLVM whole-workspace visibility, while stripping and aborting
# panics remove unwinding/symbol-table overhead from shipped artifacts.
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = false
debug-assertions = false
overflow-checks = false
incremental = false
panic = "abort"

[profile.release.build-override]
# Build scripts are tiny but run during release builds; keep
# their codegen deterministic with the same single-unit optimization policy.
opt-level = 3
codegen-units = 1

[profile.bench]
# Benchmarks should measure the production hot paths, not a lighter
# benchmark-only profile. Keep this aligned with `profile.release` except for
# fields Cargo ignores for benchmark harnesses.
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
debug-assertions = false
overflow-checks = false
incremental = false

# N-API converts unwinding Rust panics into JavaScript exceptions.
[profile.release-node]
inherits = "release"
panic = "unwind"
