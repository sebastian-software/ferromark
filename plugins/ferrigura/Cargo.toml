[package]
name = "ferromark-ferrigura"
version = "3.7.0"
edition = "2024"
rust-version.workspace = true
license = "MIT"
description = "Optional Rust code-block adapter for Ferrigura Mermaid diagrams"
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
jsx = ["ferromark/jsx"]

[dependencies]
ferromark = { version = "3.7.0", path = "../.." }
ferrigura = "=0.2.0"
cssparser = { version = "=0.37.0", default-features = false }
thiserror.workspace = true
serde_json.workspace = true
roxmltree = { version = "=0.21.1", default-features = false, features = ["std"] }

[dev-dependencies]
sha2 = "=0.10.9"
