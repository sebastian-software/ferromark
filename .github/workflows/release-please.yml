name: Release Please

# Opens and maintains the release pull request for the next version. It never
# tags, never creates a GitHub release and never publishes: `publish.yml` keeps
# doing that manually, bound to a successful main push CI run and gated on
# registry verification (ADR-0017).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release-pull-request:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release branch holding the version commit
      pull-requests: write # open and update the release pull request
      issues: write # create and move the `autorelease:` labels on that PR
    env:
      GH_TOKEN: ${{ github.token }}
      # `gh pr list --state merged` mirrors the 200 merged pull requests the
      # pinned library itself scans in `findMergedReleasePullRequests`.
      PENDING_WINDOW: "200"
    steps:
      # `skip-github-release` below suppresses `createReleases()`, which is the
      # only place the library moves `autorelease: pending` to
      # `autorelease: tagged`. A merged release pull request would therefore keep
      # the pending label forever, and `createPullRequests()` returns early while
      # any merged, pending release pull request exists ("There are untagged,
      # merged release PRs outstanding - aborting"). Without this reconciliation
      # the automation opens exactly one release pull request and then stalls.
      #
      # `publish.yml` tags the release through `gh release create v<version>
      # --target <commit>`, where the commit is whatever `main` pointed at when
      # the publication was dispatched — not necessarily the release pull
      # request's merge commit. A merged release pull request is therefore
      # published when the tag for the version it introduced exists, which is
      # read from `.release-please-manifest.json` at its merge commit. This is
      # independent of the pull request title and of later commits on `main`.
      # A merged release pull request that was deliberately never published
      # stays pending on purpose; remove its label by hand to unblock the next
      # candidate.
      - name: Retire the pending label of published release pull requests
        run: |
          pending=$(gh pr list --repo "$GITHUB_REPOSITORY" --state merged --base main \
            --label 'autorelease: pending' --limit "$PENDING_WINDOW" \
            --json number,mergeCommit --jq '.[] | "\(.number) \(.mergeCommit.oid)"')
          if [ -z "$pending" ]; then
            echo "No merged release pull request is waiting for its label."
            exit 0
          fi
          gh label create 'autorelease: tagged' --repo "$GITHUB_REPOSITORY" \
            --color ededed --description 'Release Please: published release' 2>/dev/null || true
          while read -r number sha; do
            version=$(gh api "repos/$GITHUB_REPOSITORY/contents/.release-please-manifest.json?ref=$sha" \
              --jq '.content' | base64 --decode | jq -r '."."')
            if [ -z "$version" ] || [ "$version" = "null" ]; then
              echo "Release pull request #$number: no manifest version at $sha; leaving it pending."
              continue
            fi
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" >/dev/null 2>&1; then
              echo "Release pull request #$number introduced $version, which is tagged; retiring its pending label."
              gh pr edit "$number" --repo "$GITHUB_REPOSITORY" \
                --remove-label 'autorelease: pending' --add-label 'autorelease: tagged'
            else
              echo "Release pull request #$number introduced $version, which is not published yet; leaving it pending."
            fi
          done <<< "$pending"

      # The release pull request must arrive with a personal access token.
      # A pull request opened with `GITHUB_TOKEN` does not start further workflow
      # runs, so `ci.yml` would never run on it and the pull request would show
      # no checks at all. `RELEASE_PLEASE_TOKEN` is an organization secret available to this
      # repository; the `GITHUB_TOKEN` fallback keeps forks and a revoked token
      # from failing the whole workflow, at the cost of a pull request a
      # maintainer has to nudge.
      - uses: googleapis/release-please-action@0dfd8538845b8e92600d271a895a5372865d4062 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Tag and GitHub release stay with the verified `publish.yml`. The
          # action then only runs `createPullRequests()`.
          skip-github-release: true
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
