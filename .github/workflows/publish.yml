name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@0dfd8538845b8e92600d271a895a5372865d4062 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  publish-crate:
    needs:
      - release-please
      - verify-npm-publish
    if: >-
      ${{
        always() &&
        github.ref == 'refs/heads/main' &&
        (
          github.event_name == 'workflow_dispatch' ||
          (
            needs.release-please.outputs.releases_created == 'true' &&
            needs.verify-npm-publish.result == 'success'
          )
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable

      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  build-native:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            artifact: linux-x64-gnu
            runtime_test: true
          - os: ubuntu-24.04-arm
            rust-target: aarch64-unknown-linux-gnu
            artifact: linux-arm64-gnu
            runtime_test: true
          - os: ubuntu-latest
            rust-target: x86_64-unknown-linux-musl
            artifact: linux-x64-musl
            runtime_test: false
          - os: ubuntu-latest
            rust-target: aarch64-unknown-linux-musl
            artifact: linux-arm64-musl
            runtime_test: false
          - os: macos-latest
            rust-target: aarch64-apple-darwin
            artifact: darwin-arm64
            runtime_test: true
          - os: macos-15-intel
            rust-target: x86_64-apple-darwin
            artifact: darwin-x64
            runtime_test: true
          - os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            artifact: win32-x64-msvc
            runtime_test: true
          - os: windows-11-arm
            rust-target: aarch64-pc-windows-msvc
            artifact: win32-arm64-msvc
            runtime_test: true
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: node
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: node/package.json

      - name: Set Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: node/pnpm-lock.yaml

      - name: Set Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          targets: ${{ matrix.rust-target }}

      - name: Set Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        if: ${{ contains(matrix.rust-target, '-musl') }}
        with:
          version: 0.15.2

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        if: ${{ contains(matrix.rust-target, '-musl') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native addon
        run: pnpm build:native
        env:
          FERROMARK_RUST_TARGET: ${{ matrix.rust-target }}

      - name: Test native package
        if: ${{ matrix.runtime_test }}
        run: pnpm test

      - name: Verify native artifact
        run: node ./scripts/verify-platform-artifact.mjs ${{ matrix.artifact }}

      - name: Upload native binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-${{ matrix.artifact }}
          path: node/ferromark/ferromark.${{ matrix.artifact }}.node
          if-no-files-found: error
          retention-days: 1

  publish-npm:
    needs:
      - release-please
      - build-native
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: node
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: node/package.json

      - name: Set Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: node/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level high

      - name: Download native binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: native-*
          merge-multiple: true
          path: node/ferromark/.napi-artifacts

      - name: Assemble platform packages
        run: pnpm --dir ferromark exec napi artifacts --output-dir .napi-artifacts --npm-dir npm

      - name: Verify release package
        run: node ./scripts/verify-release.mjs

      - name: Test packed package
        run: |
          pnpm test
          pnpm typecheck
          pnpm lint
          node ./scripts/verify-pack.mjs --all-targets
          pnpm smoke:clean

      - name: Publish platform packages with trusted publishing
        run: node ./scripts/publish-platform-packages.mjs

      - name: Publish main package with trusted publishing
        working-directory: node/ferromark
        run: npm publish --access public --provenance

  verify-npm-publish:
    needs:
      - release-please
      - publish-npm
    if: ${{ always() && needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Verify npm release is public
        env:
          NPM_PUBLISH_RESULT: ${{ needs.publish-npm.result }}
        run: node ./node/scripts/verify-npm-publish.mjs
