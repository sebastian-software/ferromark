name: publish

# One product, one release signal. Every push to `main` runs Release Please,
# which keeps a single release pull request open; merging it writes the version
# commit, creates the `v<version>` tag and the GitHub release, and the jobs
# below publish that tag to crates.io and npm. Merging the release pull request
# is what publishes — see docs/arch/ADR-0020-standards-release-blueprint.md and
# the blueprint in sebastian-software/standards.
#
# `workflow_dispatch` is the retry path only. A validation job resolves the
# approved release tag to one commit SHA, checks the tag and version, and passes
# that SHA to every release-source checkout. Delayed retries therefore use the
# original release source even when current main has moved forward.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)publish, for example v2.0.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release please
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the release branch and create the release tag
      pull-requests: write # open and update the release pull request
      issues: write # create and move the `autorelease:` labels
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@0dfd8538845b8e92600d271a895a5372865d4062 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Events created with the built-in GITHUB_TOKEN start no new workflow
          # runs, so the release pull request would show no checks at all.
          # RELEASE_PLEASE_TOKEN is an organization secret; the fallback keeps
          # forks and a revoked token from failing the whole workflow.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Check out the Release Please branch
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Restore the exact transform dependency pin
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          RELEASE_BRANCH: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}
        run: |
          release_base=$(git merge-base HEAD origin/main)
          git show "$release_base:Cargo.lock" > "$RUNNER_TEMP/release-base-Cargo.lock"
          node scripts/preserve-exact-transform-pin.mjs "$RUNNER_TEMP/release-base-Cargo.lock"
          if ! git diff --quiet -- transforms/Cargo.toml Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add transforms/Cargo.toml Cargo.lock
            git commit -m "chore: preserve release dependency identities"
            git push origin "HEAD:refs/heads/$RELEASE_BRANCH"
          fi

  validate-release:
    name: validate release source
    needs: release-please
    if: >-
      ${{ !cancelled() && (
        (github.event_name == 'push' && needs.release-please.outputs.releases_created == 'true') ||
        github.event_name == 'workflow_dispatch'
      ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    outputs:
      tag_name: ${{ steps.source.outputs.tag_name }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: node/package.json
      - run: pnpm -C node install --frozen-lockfile --ignore-scripts
      - id: source
        name: Resolve and validate the release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
        run: node scripts/resolve-release-source.mjs

      - name: Require a published GitHub release for the tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.source.outputs.tag_name }}
        run: node scripts/verify-github-release.mjs

      - name: Require CI for the exact release commit
        if: steps.source.outputs.require_ci == 'true'
        env:
          RELEASE_SHA: ${{ steps.source.outputs.source_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm -C node exec ferramenta-native source ci

  validate-release-version:
    name: validate release package versions
    needs: validate-release
    if: ${{ !cancelled() && needs.validate-release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /node/

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.source_sha }}
          path: release-source
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: release-tools/node/package.json
      - run: pnpm -C release-tools/node install --frozen-lockfile --ignore-scripts
      - name: Verify the release tag matches the package versions
        env:
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag_name }}
        run: node release-tools/node/scripts/verify-release.mjs --metadata-only --root release-source --tag "$RELEASE_TAG"

  publish-crates:
    name: publish to crates.io
    needs: [release-please, validate-release, validate-release-version]
    # `!cancelled()` lets the job run when release-please was skipped by the
    # manual path; a plain `needs` would skip it too.
    if: >-
      ${{ !cancelled() && needs.validate-release.result == 'success' && needs.validate-release-version.result == 'success' && (
        (github.event_name == 'push' && needs.release-please.outputs.releases_created == 'true') ||
        github.event_name == 'workflow_dispatch'
      ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # crates.io Trusted Publishing exchanges this OIDC token for a
      # short-lived registry token. It is enabled for `ferromark`. Bootstrap
      # `ferromark-transforms` with an initial credentialed publish, then enable
      # Trusted Publishing as documented in docs/releasing.md. No long-lived
      # registry secret is stored here.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.source_sha }}

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.95"

      # Publish the core before the optional transform crate that depends on
      # it. The action skips versions already in the index, making retries safe.
      - uses: sebastian-software/standards/.github/actions/publish-crates@a840766444dbb0e421f1f1868c48bee315ead769 # v0.13.0
        with:
          crates: |
            ferromark
            ferromark-transforms

  native-matrix:
    name: napi platform matrix
    needs: [release-please, validate-release, validate-release-version]
    if: >-
      ${{ !cancelled() && needs.validate-release.result == 'success' && needs.validate-release-version.result == 'success' && (
        (github.event_name == 'push' && needs.release-please.outputs.releases_created == 'true') ||
        github.event_name == 'workflow_dispatch'
      ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
      platform-ids: ${{ steps.platforms.outputs.platform-ids }}
    steps:
      # Matrix tooling comes from the immutable workflow commit so old tag retries
      # do not need the shared package to exist in the historical source tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: node/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - run: pnpm -C node install --frozen-lockfile --ignore-scripts
      - id: platforms
        working-directory: node
        run: node scripts/write-native-matrix.mjs

  build-native:
    name: build ${{ matrix.id }}
    needs: [release-please, validate-release, validate-release-version, native-matrix]
    if: ${{ !cancelled() && needs.validate-release.result == 'success' && needs.validate-release-version.result == 'success' && needs.native-matrix.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.native-matrix.outputs.matrix) }}
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: runner.os != 'Windows'
        with:
          ref: ${{ needs.validate-release.outputs.source_sha }}
      # NUL is a reserved Windows device name. Preserve the frozen report in
      # Git and omit only this historical input from Windows working trees.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: runner.os == 'Windows'
        # Git validates even sparse-excluded paths. Permit this index entry
        # only for checkout; sparse rules prevent writing the device name.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.protectNTFS
          GIT_CONFIG_VALUE_0: "false"
        with:
          ref: ${{ needs.validate-release.outputs.source_sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/reports/2026-09-14-ox-regression/normalization-guards/nul.md

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: ${{ runner.os == 'Windows' && '1' || '0' }}
          GIT_CONFIG_KEY_0: core.protectNTFS
          GIT_CONFIG_VALUE_0: "false"
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /node/
            /scripts/

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: node/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: node/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C ../release-tools/node install --frozen-lockfile --ignore-scripts
      - name: Build, verify and upload the native release artifact
        uses: ./release-tools/node/node_modules/ferramenta-native/actions/build-native
        with:
          target: ${{ matrix.target }}
          libc: ${{ matrix.libc }}
          rust-toolchain: "1.95"
          rust-components: llvm-tools
          platform-id: ${{ matrix.id }}
          source-sha: ${{ needs.validate-release.outputs.source_sha }}
          config: ../release-tools/node/native-npm.config.mjs
          test-command: ${{ matrix.native && 'pnpm test' || '' }}
        env:
          FERROMARK_RUST_TARGET: ${{ matrix.target }}
          FERROMARK_PGO: ${{ matrix.pgo && '1' || '0' }}

  publish-npm:
    name: publish to npm
    needs: [release-please, validate-release, validate-release-version, native-matrix, build-native]
    if: ${{ !cancelled() && needs.validate-release.result == 'success' && needs.validate-release-version.result == 'success' && needs.build-native.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # npm Trusted Publishing and the provenance attestation both use this
      # OIDC token. No NPM_TOKEN is needed.
      id-token: write
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.source_sha }}

      # This workflow can be retried for an immutable tag, whose tree does not
      # contain the retry-safety helper added later on main. Load only that
      # helper from the exact commit that supplied this workflow definition.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /node/scripts/
            /node/
            /scripts/

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: node/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: node/pnpm-lock.yaml


      - run: pnpm install --frozen-lockfile

      - run: pnpm -C ../release-tools/node install --frozen-lockfile --ignore-scripts
      - name: Pack, test, publish and verify the native npm release
        uses: ./release-tools/node/node_modules/ferramenta-native/actions/release-native
        with:
          source-sha: ${{ needs.validate-release.outputs.source_sha }}
          tag: ${{ needs.validate-release.outputs.tag_name }}
          config: ../release-tools/node/native-npm.config.mjs
          musl-package-tests: "true"
          publish: "true"

  verify-npm-publish:
    name: verify the npm release
    needs: [release-please, validate-release, validate-release-version, native-matrix, publish-npm]
    if: ${{ always() && needs.validate-release.result == 'success' && needs.validate-release-version.result == 'success' && needs.native-matrix.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.source_sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: node/package.json
      - run: pnpm -C node install --frozen-lockfile --ignore-scripts
      - name: Verify the published versions on the registry
        run: node ./node/scripts/verify-npm-publish.mjs
        env:
          NPM_PUBLISH_RESULT: ${{ needs.publish-npm.result }}
