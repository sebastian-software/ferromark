name: CI

on:
  push:
    branches: [main, codex/v2]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: ["1.95", stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: runner.os != 'Windows'
      # NUL is a reserved Windows device name. Preserve the frozen report in
      # Git and omit only this historical input from Windows working trees.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: runner.os == 'Windows'
        # Git validates even sparse-excluded paths. Permit this index entry
        # only for checkout; sparse rules prevent writing the device name.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.protectNTFS
          GIT_CONFIG_VALUE_0: "false"
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/reports/2026-09-14-ox-regression/normalization-guards/nul.md
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ matrix.rust }}
      - run: rustup override set "$TOOLCHAIN"
        shell: bash
        env:
          TOOLCHAIN: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: cargo test --workspace --all-features --locked
        # Complexity guards compare input sizes within a test. Running those
        # CPU-heavy guards together distorts their ratios on shared runners.
        env:
          RUST_TEST_THREADS: "1"

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.95"
          components: clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo bench --workspace --no-run --locked

  coverage:
    runs-on: ubuntu-latest
    env:
      COVERAGE_FLOOR: "90"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.95"
          components: llvm-tools-preview
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      # Serialize instrumented tests so timing guards do not compete for CPU.
      - run: cargo llvm-cov --workspace --exclude ferromark-node --all-features --locked --no-report -- --test-threads=1
      - name: Generate LCOV coverage report
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info
      - name: Summarize line coverage
        run: |
          percent=$(cargo llvm-cov report --json --summary-only | jq -r '.data[0].totals.lines.percent')
          printf 'Line coverage: %.2f%% (gate: ≥ %s%%)\n' "$percent" "$COVERAGE_FLOOR" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload LCOV coverage report
        id: upload-coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-coverage
          path: lcov.info
          if-no-files-found: error
          retention-days: 30
      - name: Link retained coverage report
        if: ${{ always() && steps.upload-coverage.outputs.artifact-url != '' }}
        run: |
          printf 'Retained report: [Download lcov.info](%s)\n' "${{ steps.upload-coverage.outputs.artifact-url }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce line coverage floor
        run: cargo llvm-cov report --fail-under-lines "$COVERAGE_FLOOR"

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.95"
          components: rustfmt
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: scripts/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: scripts/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: scripts
      - run: pnpm format:check
        working-directory: scripts
      - run: cargo fmt --all --check
      - run: node --test scripts/test-*.mjs
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      # The org-wide pin checker replaces this repository's own copy: a moved
      # tag changes what CI executes with this job's token, so every `uses:`
      # must be a full commit SHA with the version in a trailing comment.
      - uses: sebastian-software/standards/.github/actions/check-action-pins@a840766444dbb0e421f1f1868c48bee315ead769 # v0.13.0
        with:
          paths: .github/workflows
      - run: python3 scripts/publish-native-readme.py --check
      - run: node ./scripts/check-readme-family.mjs
      - run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps --all-features --locked
      - name: Check benchmark harnesses
        shell: bash
        run: |
          for directory in benchmarks/*/; do
            if compgen -G "${directory}test_*.py" > /dev/null; then
              python3 -m unittest discover -s "$directory" -p 'test_*.py'
            fi
          done

  standards:
    name: Standards / Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: "Guard: agent step not yet completed for this PR"
        run: test ! -f .standards/pending.json

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: scripts/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      # The marker guard needs `node`, so it sits below the toolchain setup
      # rather than beside the pending guard it complements.
      # `.standards/blocked.json` records an agent run that pushed a result it
      # could not validate. `blocking: true` is the CLI/stamp alignment class:
      # every verdict of that run was computed against the wrong manifest, so
      # the pull request must not merge. A non-blocking marker is context for
      # the reviewer — the failures it lists are reported by this workflow's own
      # lanes. The marker is parsed rather than matched line by line: JSON may
      # put `"blocking":` and `true` on separate lines, and a guard whose whole
      # purpose is to fail closed must fail on a marker it cannot read at all.
      # `node` rather than `jq`, which the Forgejo node image may lack; the
      # schema is `BlockedState` in @sebastian-software/standards.
      - name: "Guard: no blocking agent findings for this PR"
        run: |
          node -e "
          const { existsSync, readFileSync } = require('node:fs');
          const file = '.standards/blocked.json';
          if (!existsSync(file)) { process.exit(0); }
          const raw = readFileSync(file, 'utf8');
          console.log(raw);
          const fail = (detail) => { console.error('Refusing to pass ' + file + ': ' + detail); process.exit(1); };
          let state;
          try { state = JSON.parse(raw); } catch (error) { fail('it is not valid JSON — ' + error.message); }
          if (typeof state !== 'object' || state === null || Array.isArray(state)) { fail('it is not a JSON object.'); }
          const orNull = (value, type) => value === null || typeof value === type;
          const broken = [
            ['schemaVersion must be 1', state.schemaVersion !== 1],
            ['blocking must be a boolean', typeof state.blocking !== 'boolean'],
            ['reason must be a string', typeof state.reason !== 'string'],
            ['detectedAt must be a string', typeof state.detectedAt !== 'string'],
            ['expectedStandardsVersion must be a number', typeof state.expectedStandardsVersion !== 'number'],
            ['observedStandardsVersion must be a number or null', !orNull(state.observedStandardsVersion, 'number')],
            ['expectedCliVersion must be a string or null', !orNull(state.expectedCliVersion, 'string')],
            ['observedCliVersion must be a string or null', !orNull(state.observedCliVersion, 'string')],
            ['failedChecks must be an array of strings', !Array.isArray(state.failedChecks) || !state.failedChecks.every((entry) => typeof entry === 'string')],
            ['retry must be a string', typeof state.retry !== 'string'],
          ].filter((entry) => entry[1]).map((entry) => entry[0]);
          if (broken.length > 0) { fail('it does not match the documented schema — ' + broken.join('; ')); }
          if (state.blocking) { fail('the agent could not validate its result.'); }
          console.log('The agent marker is non-blocking; its findings are reviewer context.');
          "

      # This repository has no root package.json, so there is no lockfile to
      # hold the CLI version: the pin lives here and Renovate's custom manager
      # in renovate.json moves it. An unpinned `dlx` would execute whatever was
      # published minutes ago, with this job's token.
      #
      # minimum-release-age=0 stays: pnpm 11 defaults minimumReleaseAge to 1440
      # (24h), so without the bypass a pin raised on the day of a standards
      # release cannot resolve at all.
      - run: pnpm --config.minimum-release-age=0 dlx @sebastian-software/standards@0.13.0 check

  rustsec:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The audit tool has its own MSRV; keep its build independent of the
      # project's pinned compiler. Rust tests still cover the project MSRV.
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        env:
          RUSTUP_TOOLCHAIN: stable
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Licenses, duplicate versions, sources, and yanked crates come from
      # deny.toml; rustsec above keeps reporting advisories as a check run.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: ""

  homepage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homepage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: homepage/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: homepage/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run audit
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  node:
    runs-on: ubuntu-latest
    name: node (Node.js ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: node/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: node/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.95"
      - run: pnpm install --frozen-lockfile
      - name: Verify the lockfile matches the manifests
        run: pnpm install --lockfile-only && git diff --exit-code -- pnpm-lock.yaml
      - run: pnpm audit --audit-level high
      - run: pnpm build
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm pack:check
      - run: pnpm smoke:clean

  node-floor:
    runs-on: ubuntu-latest
    name: node (Node.js 22.12.0 floor)
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: node/package.json
      - name: Set workspace Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.13.0"
          cache: pnpm
          cache-dependency-path: node/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.95"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Set minimum supported Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.12.0"
      - name: Test minimum supported Node.js
        run: node --test ferromark/test/index.test.mjs

  native:
    # Each target is built on a runner with the same architecture. GNU targets
    # use the glibc 2.17 napi-rs toolchain; musl targets use cargo-zigbuild.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, rust_target: aarch64-apple-darwin, artifact: darwin-arm64, runtime_test: true, pgo: true }
          - { os: macos-15-intel, rust_target: x86_64-apple-darwin, artifact: darwin-x64, runtime_test: true, pgo: true }
          - { os: ubuntu-24.04-arm, rust_target: aarch64-unknown-linux-gnu, artifact: linux-arm64-gnu, runtime_test: true, pgo: true }
          - { os: ubuntu-latest, rust_target: x86_64-unknown-linux-gnu, artifact: linux-x64-gnu, runtime_test: true, pgo: true }
          - { os: ubuntu-latest, rust_target: x86_64-unknown-linux-musl, artifact: linux-x64-musl, runtime_test: false, pgo: true }
          - { os: ubuntu-latest, rust_target: aarch64-unknown-linux-musl, artifact: linux-arm64-musl, runtime_test: false, pgo: true }
          - { os: windows-latest, rust_target: x86_64-pc-windows-msvc, artifact: win32-x64-msvc, runtime_test: true, pgo: true }
          - { os: windows-11-arm, rust_target: aarch64-pc-windows-msvc, artifact: win32-arm64-msvc, runtime_test: true, pgo: false }
    runs-on: ${{ matrix.os }}
    name: native (${{ matrix.rust_target }})
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: runner.os != 'Windows'
      # NUL is a reserved Windows device name. Preserve the frozen report in
      # Git and omit only this historical input from Windows working trees.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: runner.os == 'Windows'
        # Git validates even sparse-excluded paths. Permit this index entry
        # only for checkout; sparse rules prevent writing the device name.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.protectNTFS
          GIT_CONFIG_VALUE_0: "false"
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/reports/2026-09-14-ox-regression/normalization-guards/nul.md
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: node/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: node/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.95"
          targets: ${{ matrix.rust_target }}
          # llvm-profdata merges the profile-guided training counters.
          components: llvm-tools
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        if: ${{ contains(matrix.rust_target, '-musl') }}
        with:
          version: 0.15.2
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        if: ${{ contains(matrix.rust_target, '-musl') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild
      - run: pnpm install --frozen-lockfile
      # Published addons are profile-guided; local builds stay opt-in.
      # See docs/arch/ADR-0019-profile-guided-native-addon.md.
      # Windows ARM64 stays on the plain build: the toolchain's llvm-profdata
      # rejects the counters its own instrumented binary writes there
      # ("malformed instrumentation profile data: symbol name is empty").
      # See docs/arch/ADR-0019-profile-guided-native-addon.md.
      - run: pnpm build:native
        env:
          FERROMARK_RUST_TARGET: ${{ matrix.rust_target }}
          FERROMARK_PGO: ${{ matrix.pgo && '1' || '0' }}
      - name: Test native package
        if: ${{ matrix.runtime_test }}
        run: pnpm test
      - name: Verify platform package
        run: node ./scripts/verify-platform-artifact.mjs ${{ matrix.artifact }}
      - name: Upload verified native binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-${{ matrix.artifact }}
          path: node/ferromark/npm/${{ matrix.artifact }}/ferromark.${{ matrix.artifact }}.node
          if-no-files-found: error
          retention-days: 7

  npm-packages:
    name: Assemble all npm packages
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: node/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: node/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: native-*
          merge-multiple: true
          path: node/ferromark/.napi-artifacts
      - name: Assemble all platform packages
        run: pnpm --dir ferromark exec napi artifacts --output-dir .napi-artifacts --npm-dir npm
      - run: node ./scripts/verify-release.mjs
      - run: node ./scripts/verify-pack.mjs --all-targets
      - run: pnpm smoke:clean
      - name: Upload verified npm archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-package-rehearsal
          path: node/artifacts/*.tgz
          if-no-files-found: error
          retention-days: 7

  rust-packages:
    name: Verify packaged Rust consumer
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.95"
      - run: cargo fetch --locked
      - run: python3 scripts/rehearse-rust-packages.py "$RUNNER_TEMP/rust-packages"
      - name: Upload verified Rust archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-package-rehearsal
          path: |
            ${{ runner.temp }}/rust-packages/target/package/*.crate
            ${{ runner.temp }}/rust-packages/results.json
          if-no-files-found: error
          retention-days: 7

  ci-check:
    name: CI / Check
    runs-on: ubuntu-latest
    needs:
      - test
      - clippy
      - coverage
      - fmt
      - rustsec
      - cargo-deny
      - homepage
      - node
      - node-floor
      - native
      - npm-packages
      - rust-packages
    if: ${{ always() }}
    steps:
      - name: Verify required CI jobs passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node -e "
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const failed = Object.entries(needs)
            .filter(([, job]) => job.result !== 'success')
            .map(([name, job]) => name + ': ' + job.result);
          if (failed.length > 0) {
            console.error('Required CI jobs did not pass:');
            for (const line of failed) console.error('- ' + line);
            process.exit(1);
          }
          console.log('All required CI jobs passed.');
          "
