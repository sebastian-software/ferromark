name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rust: stable, features: default, args: "" }
          - { os: macos-latest, rust: stable, features: default, args: "" }
          - { os: windows-latest, rust: stable, features: default, args: "" }
          - { os: ubuntu-latest, rust: stable, features: all, args: "--all-features" }
          - { os: ubuntu-latest, rust: stable, features: mdx, args: "--no-default-features --features mdx" }
          - { os: ubuntu-latest, rust: "1.94", features: default, args: "" }
          - { os: ubuntu-latest, rust: "1.94", features: all, args: "--all-features" }
    runs-on: ${{ matrix.os }}
    name: test (${{ matrix.os }}, rust ${{ matrix.rust }}, ${{ matrix.features }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ matrix.rust }}
      # The action only sets the rustup default, and rust-toolchain.toml
      # outranks that; a directory override outranks the file. Without this
      # line the MSRV rows would quietly test with stable instead.
      # `shell: bash` is required: the Windows default shell is pwsh, which
      # does not expand `$TOOLCHAIN`.
      - run: rustup override set "$TOOLCHAIN"
        shell: bash
        env:
          TOOLCHAIN: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: cargo test --locked ${{ matrix.args }}
      - run: cargo test -p ferro-byte-search --locked

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo clippy -p ferro-byte-search --all-targets --locked -- -D warnings

  coverage:
    runs-on: ubuntu-latest
    # The line-coverage floor lives here and nowhere else: the gate below and
    # the run summary both read it, CONTRIBUTING.md documents the same number,
    # and scripts/test-ci-hardening.mjs checks that they agree.
    env:
      COVERAGE_FLOOR: "90"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: cargo llvm-cov --all-features --locked --no-report
      # The measured percentage and the floor reach the run summary before the
      # gate below can fail the job, so a red run states both numbers.
      - name: Summarize line coverage
        run: |
          percent=$(cargo llvm-cov report --json --summary-only | jq -r '.data[0].totals.lines.percent')
          printf 'Line coverage: %.2f%% (gate: ≥ %s%%)\n' "$percent" "$COVERAGE_FLOOR" >> "$GITHUB_STEP_SUMMARY"
      - run: cargo llvm-cov report --lcov --output-path lcov.info --fail-under-lines "$COVERAGE_FLOOR"

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: rustfmt
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: scripts/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: scripts/pnpm-lock.yaml
      - name: Install contract dependencies
        run: pnpm install --frozen-lockfile
        working-directory: scripts
      # The contract scripts are a declared Node workspace, so they are
      # formatted with the org's managed oxfmt config that lives next to them.
      - name: Check the contract scripts formatting
        run: pnpm format:check
        working-directory: scripts
      - run: cargo fmt --check
      - run: python3 -m unittest discover -s benchmarks/bun-comparison -p "test_*.py"
      - run: python3 -m unittest discover -s benchmarks/cmark-comparison -p "test_*.py"
      - run: python3 -m unittest discover -s scripts -p "test_ci_benchmarks.py"
      - run: python3 benchmarks/bun-comparison/publish.py --check
      - run: python3 docs/reports/2026-09-11-native-cmark-comparison/render.py --check
      - run: ./scripts/test-check-workflow-pins.sh
      - run: node ./scripts/test-publish-verification.mjs
      - run: node --test ./scripts/test-release-version-sync.mjs
      - run: node --test ./scripts/test-node-ci-matrix.mjs
      - run: node --test ./scripts/test-contributing-ci-contract.mjs
      - run: node --test ./scripts/test-ci-hardening.mjs
      - run: node --test ./scripts/test-benchmark-ci-contract.mjs
      - run: node --test ./scripts/test-profiling-scripts.mjs
      - run: node --test ./scripts/test-docs-rs-metadata.mjs
      - run: RUSTDOCFLAGS='-D warnings' cargo doc --no-deps --all-features --locked
      - run: node --test ./scripts/test-migration-guide-contract.mjs
      - run: node --test ./scripts/test-node-options-docs-contract.mjs
      - run: node --test ./scripts/test-readme-structure-contract.mjs
      # Renders the Ferramenta family block from the registry pinned in the
      # script and fails on drift; `--write` regenerates it.
      - run: node ./scripts/check-readme-family.mjs
      - run: ./scripts/check-workflow-pins.sh

  standards:
    name: standards drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: "Guard: agent step not yet completed for this PR"
        run: test ! -f .standards/pending.json

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: scripts/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      # The marker guard needs `node`, so it sits below the toolchain setup
      # rather than beside the pending guard it complements.
      # `.standards/blocked.json` records an agent run that pushed a result it
      # could not validate. `blocking: true` is the CLI/stamp alignment class:
      # every verdict of that run was computed against the wrong manifest, so
      # the pull request must not merge. A non-blocking marker is context for
      # the reviewer — the failures it lists are reported by this workflow's own
      # lanes. The marker is parsed rather than matched line by line: JSON may
      # put `"blocking":` and `true` on separate lines, and a guard whose whole
      # purpose is to fail closed must fail on a marker it cannot read at all.
      # `node` rather than `jq`, which the Forgejo node image may lack; the
      # schema is `BlockedState` in @sebastian-software/standards.
      - name: "Guard: no blocking agent findings for this PR"
        run: |
          node -e "
          const { existsSync, readFileSync } = require('node:fs');
          const file = '.standards/blocked.json';
          if (!existsSync(file)) { process.exit(0); }
          const raw = readFileSync(file, 'utf8');
          console.log(raw);
          const fail = (detail) => { console.error('Refusing to pass ' + file + ': ' + detail); process.exit(1); };
          let state;
          try { state = JSON.parse(raw); } catch (error) { fail('it is not valid JSON — ' + error.message); }
          if (typeof state !== 'object' || state === null || Array.isArray(state)) { fail('it is not a JSON object.'); }
          const orNull = (value, type) => value === null || typeof value === type;
          const broken = [
            ['schemaVersion must be 1', state.schemaVersion !== 1],
            ['blocking must be a boolean', typeof state.blocking !== 'boolean'],
            ['reason must be a string', typeof state.reason !== 'string'],
            ['detectedAt must be a string', typeof state.detectedAt !== 'string'],
            ['expectedStandardsVersion must be a number', typeof state.expectedStandardsVersion !== 'number'],
            ['observedStandardsVersion must be a number or null', !orNull(state.observedStandardsVersion, 'number')],
            ['expectedCliVersion must be a string or null', !orNull(state.expectedCliVersion, 'string')],
            ['observedCliVersion must be a string or null', !orNull(state.observedCliVersion, 'string')],
            ['failedChecks must be an array of strings', !Array.isArray(state.failedChecks) || !state.failedChecks.every((entry) => typeof entry === 'string')],
            ['retry must be a string', typeof state.retry !== 'string'],
          ].filter((entry) => entry[1]).map((entry) => entry[0]);
          if (broken.length > 0) { fail('it does not match the documented schema — ' + broken.join('; ')); }
          if (state.blocking) { fail('the agent could not validate its result.'); }
          console.log('The agent marker is non-blocking; its findings are reviewer context.');
          "

      # This repository has no root package.json, so there is no lockfile to
      # hold the CLI version: the pin lives here and Renovate's custom manager
      # in renovate.json moves it. An unpinned `dlx` would execute whatever was
      # published minutes ago, with this job's token.
      #
      # minimum-release-age=0 stays: pnpm 11 defaults minimumReleaseAge to 1440
      # (24h), so without the bypass a pin raised on the day of a standards
      # release cannot resolve at all.
      - run: pnpm --config.minimum-release-age=0 dlx @sebastian-software/standards@0.10.0 check

  rustsec:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Licenses, duplicate versions, sources, and yanked crates come from
      # deny.toml; rustsec above keeps reporting advisories as a check run.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: ""

  homepage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homepage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: homepage/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: homepage/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run audit
      - run: pnpm typecheck
      - run: pnpm build

  node:
    runs-on: ubuntu-latest
    name: node (Node.js ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: node/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: node/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - run: pnpm install --frozen-lockfile
      - name: Verify the lockfile matches the manifests
        run: pnpm install --lockfile-only && git diff --exit-code -- pnpm-lock.yaml
      - run: pnpm audit --audit-level high
      - run: pnpm build
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm pack:check
      - run: pnpm smoke:clean

  node-floor:
    runs-on: ubuntu-latest
    name: node (Node.js 22.12.0 floor)
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: node/package.json
      - name: Set workspace Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.13.0"
          cache: pnpm
          cache-dependency-path: node/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Set minimum supported Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.12.0"
      - name: Test minimum supported Node.js
        run: node --test ferromark/test/index.test.mjs

  native:
    # Each target is built on a runner with the same architecture. GNU targets
    # use the glibc 2.17 napi-rs toolchain; musl targets use cargo-zigbuild.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, rust_target: aarch64-apple-darwin, artifact: darwin-arm64, runtime_test: true }
          - { os: macos-15-intel, rust_target: x86_64-apple-darwin, artifact: darwin-x64, runtime_test: true }
          - { os: ubuntu-24.04-arm, rust_target: aarch64-unknown-linux-gnu, artifact: linux-arm64-gnu, runtime_test: true }
          - { os: ubuntu-latest, rust_target: x86_64-unknown-linux-gnu, artifact: linux-x64-gnu, runtime_test: true }
          - { os: ubuntu-latest, rust_target: x86_64-unknown-linux-musl, artifact: linux-x64-musl, runtime_test: false }
          - { os: ubuntu-latest, rust_target: aarch64-unknown-linux-musl, artifact: linux-arm64-musl, runtime_test: false }
          - { os: windows-latest, rust_target: x86_64-pc-windows-msvc, artifact: win32-x64-msvc, runtime_test: true }
          - { os: windows-11-arm, rust_target: aarch64-pc-windows-msvc, artifact: win32-arm64-msvc, runtime_test: true }
    runs-on: ${{ matrix.os }}
    name: native (${{ matrix.rust_target }})
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: node/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: node/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        if: ${{ contains(matrix.rust_target, '-musl') }}
        with:
          version: 0.15.2
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        if: ${{ contains(matrix.rust_target, '-musl') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:native
        env:
          FERROMARK_RUST_TARGET: ${{ matrix.rust_target }}
      - name: Test native package
        if: ${{ matrix.runtime_test }}
        run: pnpm test
      - name: Verify platform package
        run: node ./scripts/verify-platform-artifact.mjs ${{ matrix.artifact }}
