name: Benchmarks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  escape-screen:
    name: Native escape integration screen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Native before/after screens
        run: |
          set -o pipefail
          python3 -u scripts/escape-linux-screen.py | tee "$RUNNER_TEMP/escape-linux-output.log"
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: escape-linux-evidence
          path: |
            ${{ runner.temp }}/escape-linux-evidence
            ${{ runner.temp }}/escape-linux-output.log
