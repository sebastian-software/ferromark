[package]
name="corpus-ferro"
version="0.0.0"
edition="2024"
[workspace]
[features]
oxide=[]
counters=["ferro/profiling"]
[dependencies]
ferro={package="ferromark",path="../source",features=["mdx"]}
serde={version="1",features=["derive"]}
serde_json="1"
[profile.release]
opt-level=3
lto="fat"
codegen-units=1
panic="abort"
[profile.sample]
inherits="release"
debug=true
strip=false
