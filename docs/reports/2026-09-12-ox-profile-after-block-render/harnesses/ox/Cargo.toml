[package]
name="corpus-ox"
version="0.0.0"
edition="2024"
[workspace]
[features]
default=["oxide"]
oxide=[]
counters=[]
[dependencies]
ox_content_allocator={path="../ox-source/crates/ox_content_allocator"}
ox_content_parser={path="../ox-source/crates/ox_content_parser"}
ox_content_renderer={path="../ox-source/crates/ox_content_renderer"}
serde={version="1",features=["derive"]}
serde_json="1"
[profile.release]
opt-level=3
lto="fat"
codegen-units=1
panic="abort"
[profile.sample]
inherits="release"
debug=true
strip=false
