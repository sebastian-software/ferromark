[package]
name = "ferromark-native-pipeline-comparison"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
ferromark = { path = "../..", features = ["mdx"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
html-escape = "=0.2.14"
satteri = { git = "https://github.com/bruits/satteri", rev = "b3d38e1e341c809b20b76a655e9b1601d11bd1f0" }
satteri-ast = { git = "https://github.com/bruits/satteri", rev = "b3d38e1e341c809b20b76a655e9b1601d11bd1f0" }
satteri-pulldown-cmark = { git = "https://github.com/bruits/satteri", rev = "b3d38e1e341c809b20b76a655e9b1601d11bd1f0" }
satteri-mdxjs = { git = "https://github.com/bruits/satteri", rev = "b3d38e1e341c809b20b76a655e9b1601d11bd1f0" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
