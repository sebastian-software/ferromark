[package]
name = "ferromark-markdown-rs-comparison"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "markdown-rs-driver"
path = "main.rs"

[dependencies]
markdown = { git = "https://github.com/wooorm/markdown-rs", rev = "1506572f9b406431402928f3a8b3df0b4ae2d8f5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
