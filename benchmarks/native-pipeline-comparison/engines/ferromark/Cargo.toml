[package]
name = "ferromark-pair-baseline"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "ferromark-driver"
path = "main.rs"

[dependencies]
ferromark = { path = "../../../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
html-escape = "=0.2.14"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
