[package]
name = "ferromark-node"
version = "3.7.0"
edition = "2024"
rust-version.workspace = true
license = "MIT"
authors = ["Sebastian Software GmbH"]
publish = false
build = "build.rs"

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]
doctest = false
test = true

[[bin]]
name = "pgo_train"
path = "src/bin/pgo_train.rs"
# `napi build` compiles every target of this package. The profile-guided
# training driver is a build tool, so it stays out of the addon build.
required-features = ["pgo-train"]

[features]
# Retain the existing npm compiler during the 3.x migration. Custom builds can
# omit all engines with --no-default-features.
default = ["ferriki"]
ferriki = ["ferromark/ferriki-remote"]
ferrigura = ["dep:ferromark-ferrigura"]
plugin-test = ["dep:ferromark-plugin-fixture"]
# Diagnostic N-API exports for `node/ferromark/bench/boundary.mjs`. Like
# `panic-test`, never part of a published addon: `build-native.mjs` builds it
# only into an isolated output directory. `napi10` adds the external-string
# call one candidate prototypes; it touches no code the public exports run.
boundary-bench = ["napi/napi10"]
panic-test = []
pgo-train = []

[dependencies]
# Explicit `version` next to `path`: Release Please updates published internal
# requirements written this way and deliberately skips a bare path dependency.
ferromark = { version = "3.7.0", path = "../..", features = ["jsx"] }
ferromark-transforms = { version = "3.7.0", path = "../../transforms" }
ferromark-plugin-fixture = { version = "3.7.0", path = "../plugin-fixture", optional = true }
ferromark-ferrigura = { version = "3.7.0", path = "../../plugins/ferrigura", optional = true, features = [
  "jsx",
] }
napi = { version = "=3.11.0", default-features = false, features = ["dyn-symbols", "napi8"] }
napi-derive = "=3.6.0"
serde_json.workspace = true
self_cell = "=1.3.0"

[build-dependencies]
napi-build = "=2.3.2"
