[package]
name = "ferromark-node"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
authors = ["Sebastian Software GmbH"]
publish = false
build = "build.rs"

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]
doctest = false
test = false

[[bin]]
name = "pgo_train"
path = "src/bin/pgo_train.rs"
# `napi build` compiles every target of this package. The profile-guided
# training driver is a build tool, so it stays out of the addon build.
required-features = ["pgo-train"]

[features]
panic-test = []
pgo-train = []

[dependencies]
ferromark.workspace = true
napi = { version = "=3.11.0", default-features = false, features = ["dyn-symbols", "napi8"] }
napi-derive = "=3.6.0"

[build-dependencies]
napi-build = "=2.3.2"
