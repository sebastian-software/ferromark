packages:
  - ferromark
  - ferromark/npm/*

linkWorkspacePackages: true

supportedArchitectures:
  os:
    - darwin
    - linux
    - win32
  cpu:
    - arm64
    - x64
  libc:
    - glibc
    - musl

allowBuilds:
  "@napi-rs/cli": true
  unrs-resolver: true

overrides:
  # GHSA-2883-xcg3-v3hh: count empty YAML merge sources toward the work limit.
  js-yaml@>=4.0.0 <4.3.2: 4.3.2
