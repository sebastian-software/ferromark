# Dependency policy for the MIT-licensed Ferromark v2 distribution.
#
# The allow-list is the permissive set shared across the Ferramenta family.
# Widening it is a reviewed decision, not a routine fix: every entry has to be
# compatible with distributing the MIT-licensed v2 core.

[graph]
all-features = true

[advisories]
# A yanked package still builds from Cargo.lock, but must not ship unnoticed.
yanked = "deny"
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

# Oxc's number printer is dual-licensed; select the Boost option for this
# reviewed version. Source redistribution retains its notices and license.
[[licenses.exceptions]]
crate = "dragonbox_ecma@0.1.12"
allow = ["BSL-1.0"]

# This certificate data is a wasm32-only rustls-platform-verifier dependency.
# Native Node builds use the operating system's trust store; cargo-deny still
# checks the union of all targets. See ADR-0023 for the redistribution policy.
[[licenses.exceptions]]
crate = "webpki-root-certs@1.0.9"
allow = ["CDLA-Permissive-2.0"]

[bans]
# Duplicate versions are surfaced for maintenance review without blocking a
# build that is otherwise safe.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
