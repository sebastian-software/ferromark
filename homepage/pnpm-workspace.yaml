# Ardo's optional Mermaid peer is unused by this site.
autoInstallPeers: false

allowBuilds:
  esbuild: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - ferramenta-family@2.0.0
  - markdown-it@14.3.3
  - brace-expansion@5.0.12
  - vite@7.3.7

overrides:
  # Older minimatch releases need brace-expansion's v2 default export.
  brace-expansion@>=5.0.0 <5.0.12: 5.0.12
  browserslist@<=4.28.6: 4.28.7
  esbuild@>=0.27.3 <0.28.1: 0.28.1
  # GHSA-2883-xcg3-v3hh: preserve gray-matter's v3 API while fixing merge limits.
  js-yaml@>=3.0.0 <3.15.2: 3.15.2
  # GHSA-hp3w-g68c-fv3c: the homepage uses js-yaml parsing, not its CLI.
  "js-yaml@3.15.2>argparse": 2.0.1
  lodash@<=4.17.23: 4.18.1
  nanoid@<3.3.18: 3.3.18
  picomatch@>=4.0.0 <4.0.4: 4.0.5
  postcss@<8.5.23: 8.5.23
  rollup@>=4.0.0 <4.59.0: 4.59.0
  # GHSA-68fv-2mgg-jv7q: event-loop denial of service through section offsets.
  source-map-js@>=1.0.0 <1.2.2: 1.2.2
  toml@<4.2.0: 4.2.0
  vite@>=7.0.0 <7.3.7: 7.3.7
  yaml@>=2.0.0 <2.8.3: 2.8.3
